# LiteLLM proxy, production: the permit desk's LLM gateway in a Cloudflare
# Container (gateway/worker.ts). Every value that's a secret comes from the
# environment, which the Worker fills from its own secrets.
# Prices must match src/gateway/config.ts (test/gateway.test.ts checks).

model_list:
  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005
  - model_name: gpt-oss-120b
    litellm_params:
      # Workers AI's OpenAI-compatible endpoint:
      # https://api.cloudflare.com/client/v4/accounts/<account id>/ai/v1
      model: openai/@cf/openai/gpt-oss-120b
      api_base: os.environ/WORKERS_AI_BASE_URL
      api_key: os.environ/CLOUDFLARE_AI_TOKEN
      input_cost_per_token: 0.00000035
      output_cost_per_token: 0.00000075

  # provider-down's route: a closed port, so the call fails and falls back.
  - model_name: claude-haiku-5-5-down
    litellm_params:
      model: openai/unreachable
      api_base: http://127.0.0.1:9/v1
      api_key: none
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005

router_settings:
  fallbacks: [{ "claude-haiku-5-5": ["gpt-oss-120b"] }, { "claude-haiku-5-5-down": ["gpt-oss-120b"] }]
  num_retries: 1
  timeout: 60

litellm_settings:
  drop_params: true
  request_timeout: 60
  # No Langfuse callback: the engine traces each call inside its run's trace
  # (src/sdk/trace.ts). A callback here would log every call a second time,
  # as its own unlinked trace.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_spend_logs: false
