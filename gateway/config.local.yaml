# LiteLLM proxy, local: the same model names, prices and fallback as
# config.yaml, pointed at the fake upstream (gateway/fake-upstream.mjs), so
# budgets and fallbacks can be proved without a provider or a cent spent.

model_list:
  - model_name: claude-haiku-5-5
    litellm_params:
      model: openai/claude-haiku-5-5
      api_base: http://upstream:8080/v1
      api_key: fake
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005
  - model_name: gpt-oss-120b
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: http://upstream:8080/v1
      api_key: fake
      input_cost_per_token: 0.00000035
      output_cost_per_token: 0.00000075

  # provider-down's route: a closed port, so the call fails and falls back.
  - model_name: claude-haiku-5-5-down
    litellm_params:
      model: openai/unreachable
      api_base: http://127.0.0.1:9/v1
      api_key: none
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005

router_settings:
  fallbacks: [{ "claude-haiku-5-5": ["gpt-oss-120b"] }, { "claude-haiku-5-5-down": ["gpt-oss-120b"] }]
  num_retries: 0
  timeout: 30

litellm_settings:
  drop_params: true
  request_timeout: 30

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
